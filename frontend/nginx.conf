server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Uploads are sent one chunk at a time; the default 1m would reject them.
  client_max_body_size 64m;

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Downloads and zipped folders stream for as long as Google takes to serve the chunks.
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  location /health {
    proxy_pass http://backend:3000/health;
  }

  # Hashed assets never change; the entry HTML must not be cached or a deploy goes unnoticed.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
